# Local full stack (Postgres + API). Also importable as a Coolify "Docker
# Compose" resource. For a plain Coolify "Application" (Dockerfile) resource,
# use Coolify's own PostgreSQL resource and just set DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: wishlist
      POSTGRES_DB: wishlist
    ports:
      - '5432:5432'
    volumes:
      - wishlist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wishlist']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://wishlist:wishlist@db:5432/wishlist
      PORT: 3000
      CORS_ORIGIN: '*'
      SEED_MEMBERS: 'Alice,Bob,Carol'
      SEED_DEMO: 'true'
      # API_TOKEN: change-me
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  wishlist_pgdata:
